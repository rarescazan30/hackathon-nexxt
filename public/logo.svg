<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- LifeGrowth logo: a low-poly piggy bank (same flat-faceted style as the island). -->
  <rect width="64" height="64" rx="16" fill="#33256c"/>
  <!-- coin going in -->
  <polygon points="34,10 38,12 38,17 34,19 30,17 30,12" fill="#f5c542"/>
  <polygon points="34,10 38,12 34,14.5 30,12" fill="#fadb7a"/>
  <!-- ear -->
  <polygon points="23,24 26,16 31,22" fill="#e7859f"/>
  <!-- body facets -->
  <polygon points="20,24 34,21 30,33" fill="#f9cfe0"/>
  <polygon points="34,21 46,25 30,33" fill="#f6b8cf"/>
  <polygon points="46,25 51,33 30,33" fill="#ee9dbd"/>
  <polygon points="14,34 20,24 30,33" fill="#f6b8cf"/>
  <polygon points="14,34 30,33 24,46 16,42" fill="#ee9dbd"/>
  <polygon points="30,33 51,33 48,42 38,46 24,46" fill="#e7859f"/>
  <!-- snout -->
  <polygon points="50,29 56,30.5 56,37.5 50,38" fill="#f19ab9"/>
  <circle cx="53.6" cy="32.6" r="0.9" fill="#b9577c"/>
  <circle cx="53.6" cy="35.4" r="0.9" fill="#b9577c"/>
  <!-- legs -->
  <polygon points="21,44 26,45 25,52 21,52" fill="#d9718f"/>
  <polygon points="37,45 42,45 41.5,52 37.5,52" fill="#d9718f"/>
  <!-- eye, coin slot, tail -->
  <circle cx="44" cy="29" r="1.4" fill="#33256c"/>
  <line x1="29" y1="23.2" x2="37" y2="22.2" stroke="#b9577c" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M14.5 33.5 q-4 -1 -3 -4 q1 -2 3 -0.5" fill="none" stroke="#e7859f" stroke-width="1.6" stroke-linecap="round"/>
</svg>
